<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>春日笔记 · 清新小栈</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #e8f5e9 0%, #f1f8e9 100%);
            font-family: 'Segoe UI', 'Roboto', 'Noto Sans', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
            color: #2c3e2f;
            line-height: 1.5;
            padding: 2rem 1.5rem;
            min-height: 100vh;
        }

        /* 主容器 */
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* 樱花飘落装饰（纯CSS动画） */
        .sakura {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
            overflow: hidden;
        }

        .petal {
            position: absolute;
            background: rgba(255, 210, 210, 0.7);
            width: 8px;
            height: 8px;
            border-radius: 50% 0 50% 50%;
            transform: rotate(45deg);
            opacity: 0.6;
            animation: fall linear infinite;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* 卡片式内容 */
        .hero {
            text-align: center;
            margin-bottom: 3rem;
            position: relative;
        }

        .hero h1 {
            font-size: 3rem;
            background: linear-gradient(135deg, #4caf50, #81c784, #ffb74d);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 2px 2px 12px rgba(100, 80, 50, 0.1);
            margin-bottom: 0.5rem;
        }

        .hero p {
            font-size: 1.2rem;
            color: #5a6e5a;
            border-bottom: 2px dashed #c8e6c9;
            display: inline-block;
            padding-bottom: 0.5rem;
        }

        /* 笔记列表卡片网格 */
        .notes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.8rem;
            margin: 2rem 0 3rem;
        }

        .note-card {
            background: rgba(255, 255, 240, 0.85);
            backdrop-filter: blur(2px);
            border-radius: 32px;
            padding: 1.5rem;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.05), 0 2px 4px rgba(0, 0, 0, 0.02);
            transition: all 0.25s ease;
            border: 1px solid #e0f2e0;
        }

        .note-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 30px -12px rgba(60, 80, 30, 0.2);
            background: #fffff5;
            border-color: #c5e0b4;
        }

        .note-icon {
            font-size: 2.2rem;
            margin-bottom: 0.8rem;
        }

        .note-card h3 {
            font-size: 1.4rem;
            margin-bottom: 0.5rem;
            color: #2e6b2f;
        }

        .note-card h3 a {
            text-decoration: none;
            color: inherit;
            transition: color 0.2s;
        }

        .note-card h3 a:hover {
            color: #ff9e4a;
        }

        .note-date {
            font-size: 0.8rem;
            color: #8b9b6e;
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .note-desc {
            color: #4a5b44;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        /* 页脚 */
        .footer {
            text-align: center;
            margin-top: 4rem;
            padding-top: 2rem;
            border-top: 1px solid #cfe3cf;
            font-size: 0.85rem;
            color: #7b8f6e;
        }

        /* 响应式调整 */
        @media (max-width: 640px) {
            body {
                padding: 1rem;
            }
            .hero h1 {
                font-size: 2.2rem;
            }
            .notes-grid {
                gap: 1rem;
            }
        }

        /* 点缀小叶子 */
        .leaf {
            position: fixed;
            bottom: 20px;
            right: 20px;
            opacity: 0.3;
            font-size: 2rem;
            pointer-events: none;
            z-index: 998;
        }
    </style>
</head>
<body>
    <div class="sakura" id="sakura-container"></div>
    <div class="leaf">🍃</div>

    <div class="container">
        <div class="hero">
            <h1>🌸 春日笔记 · 清新小栈</h1>
            <p>记录学习与生活的温柔片段</p>
        </div>

        <!-- 笔记卡片列表区（请根据你的实际文件修改链接和描述） -->
        <div class="notes-grid" id="notes-list">
            <!-- 示例笔记1：README.md（默认第一篇） -->
            <div class="note-card">
                <div class="note-icon">📖</div>
                <h3><a href="README.md">初遇 · 我的第一篇笔记</a></h3>
                <div class="note-date">📅 2025-04-01</div>
                <div class="note-desc">在 GitHub Pages 上写下的第一份记录，关于 Markdown 和春天的开始。</div>
            </div>

            <!-- 示例笔记2：如果你有 notes/ 文件夹，可添加类似卡片 -->
            <!-- 
            <div class="note-card">
                <div class="note-icon">☕</div>
                <h3><a href="notes/git-笔记.md">Git 常用命令小抄</a></h3>
                <div class="note-date">📅 2025-04-02</div>
                <div class="note-desc">版本控制的基础指令与场景速查。</div>
            </div>
            -->

            <!-- 你可以继续在这里添加更多卡片，按实际笔记文件名调整链接 -->
        </div>

        <div class="footer">
            🌱 用 Markdown 书写 · 由 GitHub Pages 温柔托管<br>
            每片花瓣都是灵感的形状
        </div>
    </div>

    <script>
        // 动态生成飘落樱花（数量随屏幕宽度调整）
        function createPetals() {
            const container = document.getElementById('sakura-container');
            const petalCount = Math.min(35, Math.floor(window.innerWidth / 30));
            for (let i = 0; i < petalCount; i++) {
                const petal = document.createElement('div');
                petal.classList.add('petal');
                const size = Math.random() * 10 + 6;
                petal.style.width = size + 'px';
                petal.style.height = size + 'px';
                petal.style.left = Math.random() * 100 + '%';
                petal.style.animationDuration = Math.random() * 5 + 4 + 's';
                petal.style.animationDelay = Math.random() * 8 + 's';
                petal.style.opacity = Math.random() * 0.5 + 0.3;
                container.appendChild(petal);
            }
        }
        window.addEventListener('resize', () => {
            const container = document.getElementById('sakura-container');
            container.innerHTML = '';
            createPetals();
        });
        createPetals();
    </script>
</body>
</html>
